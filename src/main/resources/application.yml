# 调试配置，当配置为true时，把堆栈跟踪的错误信息也返回给前端
debug:
  errorMsgShow: false

server:
  port: 8080

spring:
  profiles:
    # 默认激活开发环境（可通过启动参数覆盖：--spring.profiles.active=prod）
    active: prod
  mvc:
    view:
      suffix: .html
      prefix: /
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB

mybatis-plus:
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-not-delete-value: 0
      logic-delete-value: 1

# 腾讯云 OCR 表格识别V3（图片导入用），密钥建议生产环境通过环境变量覆盖
tencent:
  ocr:
    secret-id: ${TENCENT_OCR_SECRET_ID}
    secret-key: ${TENCENT_OCR_SECRET_KEY}
    region: ap-guangzhou
    endpoint: ocr.tencentcloudapi.com

# 百度OCR
baidu:
  ocr:
    api-key: ${BAIDU_OCR_API_KEY}
    secret-key: ${BAIDU_OCR_SECRET_KEY}
    appid: ${BAIDU_OCR_APPID}